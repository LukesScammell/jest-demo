name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: node-${{ matrix.node }} • ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Env diag
        run: |
          node -v
          npm -v
          npm config get registry
          npm config get fund
          npm config get audit

      - name: Install deps (prefer lockfile)
        shell: bash
        run: |
          set -euxo pipefail
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci --no-audit --no-fund
          else
            echo "No npm lockfile found; using 'npm install'."
            npm install --no-audit --no-fund
          fi

      - name: Show tree (optional)
        if: ${{ runner.os == 'Linux' }}
        run: npm ls || true

      - name: Run tests
        env:
          CI: true
        run: npx jest --ci --reporters=default --reporters=github-actions
